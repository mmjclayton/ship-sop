name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # ship-sop's own bash. Blocking.
      - name: shellcheck (ship-sop scripts)
        run: shellcheck -S warning setup.sh scripts/auto-ship-hook.sh scripts/{install-codex,setup-codex,codex-review}.sh tests/codex-install.sh

      - name: bash -n (ship-sop scripts)
        run: |
          bash -n setup.sh
          bash -n scripts/auto-ship-hook.sh

      # agent-sop pristine replicas. Advisory only — fixes belong upstream in
      # the agent-sop repo and are re-synced via /update-agent-sop, so a finding
      # here must not block a ship-sop PR (CLAUDE.md rule 8).
      - name: shellcheck (agent-sop replicas, advisory)
        continue-on-error: true
        run: |
          shellcheck -S warning \
            scripts/refresh-rollup.sh \
            scripts/refresh-in-flight.sh \
            scripts/validate-state-transitions.sh

      - name: Validate JSON
        run: |
          for f in ship-sop.config.json \
                   docs/templates/ship-sop.config.json \
                   docs/templates/ship-sop.schema.json \
                   .claude/settings.json \
                   .claude/agent-sop.config.json; do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Codex install and isolation fixtures
        run: bash tests/codex-install.sh

      - name: Reject legacy flat hook entries
        run: |
          if jq -e '.hooks.Stop[]? | select((.command? // "") == "scripts/auto-ship-hook.sh")' .claude/settings.json >/dev/null; then
            echo "::error::Legacy flat hook entry cannot execute"
            exit 1
          fi
