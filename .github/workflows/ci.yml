name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell and config
    runs-on: ubuntu-latest
    steps:
      # Full history: tests/legacy-hook.sh and tests/install-agents.sh read
      # shipped versions that exist only as blobs in it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Every script ship-sop ships or tests with, the push gate included. Blocking.
      - name: shellcheck
        run: shellcheck -S warning setup.sh scripts/*.sh scripts/hooks/*.sh tests/*.sh

      - name: bash -n
        run: |
          for f in setup.sh scripts/*.sh scripts/hooks/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Validate JSON
        run: |
          for f in ship-sop.config.json \
                   docs/templates/ship-sop.config.json \
                   docs/templates/ship-sop.schema.json \
                   .claude/settings.json; do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      # ship-sop stands alone: nothing here may need another checkout.
      - name: No external checkout dependency
        run: |
          if grep -rnE 'AGENT_SOP_SOURCE|Projects/agent-sop' setup.sh scripts tests; then
            echo "::error::a script or test depends on an external checkout"
            exit 1
          fi

      - name: Push gate, project type and receipt rules
        run: bash tests/push-gate.sh

      - name: Push gate installer and migration
        run: bash tests/install-hooks.sh

      - name: Severity rule shared by Claude and Codex
        run: bash tests/severity-rule.sh
      - name: Claude agents and gate install
        run: bash tests/install-agents.sh

      - name: Codex install and isolation fixtures
        run: bash tests/codex-install.sh

      - name: Claude install defaults
        run: bash tests/claude-install.sh

      - name: Legacy project hook retired
        run: bash tests/legacy-hook.sh

      - name: Receipt library check
        run: bash tests/receipt-lib-check.sh

      - name: Receipt totals
        run: bash tests/receipt-totals.sh

      - name: Receipt assembly contract
        run: bash tests/receipt-contract.sh

      - name: Receipt integration with the shipped library
        run: bash tests/receipt-integration.sh

      - name: Backlog state transitions
        run: bash tests/validate-state-transitions.sh

      - name: Codex usage helper
        run: bash tests/codex-usage.sh

      # P25: no project-scope auto-ship-hook.sh entry, in either shape, may
      # remain in this repository.
      - name: Reject legacy project hook entries
        run: |
          jq -e . .claude/settings.json >/dev/null
          if jq -e '[.. | objects | select(.command? == "scripts/auto-ship-hook.sh")] | length > 0' .claude/settings.json >/dev/null; then
            echo "::error::Legacy auto-ship-hook.sh entry in .claude/settings.json"
            exit 1
          fi
