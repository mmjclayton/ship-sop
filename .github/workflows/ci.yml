name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell and config
    runs-on: ubuntu-latest
    steps:
      # Full history: tests/legacy-hook.sh reads the removed hook's shipped blobs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # ship-sop's own bash. Blocking.
      - name: shellcheck (ship-sop scripts)
        run: shellcheck -S warning setup.sh scripts/{install-codex,setup-codex,codex-review,ship-receipt}.sh tests/*.sh

      - name: bash -n (ship-sop scripts)
        run: |
          bash -n setup.sh
          for t in tests/*.sh; do bash -n "$t"; done

      # agent-sop pristine replicas. Advisory only — fixes belong upstream in
      # the agent-sop repo and are re-synced via /update-agent-sop, so a finding
      # here must not block a ship-sop PR (CLAUDE.md rule 8).
      - name: shellcheck (agent-sop replicas, advisory)
        continue-on-error: true
        run: |
          shellcheck -S warning \
            scripts/refresh-rollup.sh \
            scripts/refresh-in-flight.sh \
            scripts/validate-state-transitions.sh

      - name: Validate JSON
        run: |
          for f in ship-sop.config.json \
                   docs/templates/ship-sop.config.json \
                   docs/templates/ship-sop.schema.json \
                   .claude/settings.json \
                   .claude/agent-sop.config.json; do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Codex install and isolation fixtures
        run: bash tests/codex-install.sh

      - name: Claude install defaults
        run: bash tests/claude-install.sh

      - name: Legacy project hook retired
        run: bash tests/legacy-hook.sh

      - name: Receipt assembly contract
        run: bash tests/receipt-contract.sh

      - name: Codex usage helper
        run: bash tests/codex-usage.sh

      # The one suite that exercises both repositories together. agent-sop's
      # validator decides whether a receipt qualifies. Tracking agent-sop main is
      # deliberate: the projects upgrade together, so an upstream change that
      # breaks ship-sop should turn this red. The SHA is logged for reruns.
      - name: Check out agent-sop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mmjclayton/agent-sop
          path: agent-sop
          persist-credentials: false

      - name: Record agent-sop commit
        run: git -C agent-sop rev-parse HEAD

      - name: Cross-package receipt integration
        run: bash tests/receipt-integration.sh
        env:
          AGENT_SOP_SOURCE: ${{ github.workspace }}/agent-sop

      # P25: auto-mode runs from agent-sop's user-scope hooks. No project-scope
      # auto-ship-hook.sh entry, in either shape, may remain in this repository.
      - name: Reject legacy project hook entries
        run: |
          jq -e . .claude/settings.json >/dev/null
          if jq -e '[.. | objects | select(.command? == "scripts/auto-ship-hook.sh")] | length > 0' .claude/settings.json >/dev/null; then
            echo "::error::Legacy auto-ship-hook.sh entry in .claude/settings.json"
            exit 1
          fi
