version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # Majors change action behaviour; take them by hand, never by auto-merge.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
